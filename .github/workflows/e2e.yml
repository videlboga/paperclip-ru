name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      skip_llm:
        description: "Skip LLM-dependent assertions (default: true)"
        type: boolean
        default: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAPERCLIP_E2E_SKIP_LLM: ${{ inputs.skip_llm && 'true' || 'false' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # GitHub-hosted ubuntu-latest runners already ship Google Chrome + Chromium.
      # Use the system Chrome channel instead of downloading browsers from the
      # Playwright CDN, which hangs on extraction.
      PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
      PLAYWRIGHT_BROWSERS_PATH: 0
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Playwright uses the Google Chrome already installed on ubuntu-latest runners.
      # Skip downloading Chromium from the Playwright CDN, which hangs on extraction.

      - run: pnpm build
      - run: pnpm run test:e2e
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
          PLAYWRIGHT_BROWSERS_PATH: 0
          PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
